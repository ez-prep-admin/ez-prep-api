      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXAMFLEX_SSH_PRIVATE_KEY }}

      - name: Add ExamFlex server to known_hosts
        run: |

name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy-ezprep:
    name: Deploy EZ Prep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-ezprep
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EZ Prep server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy EZ Prep
        run: |
          ssh \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "bash /var/www/ez-prep-api/scripts/deploy.sh"

      - name: Notify Discord (Success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "✅ EZ Prep Deployment Succeeded",
                "color": 5763719,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "'"${{ github.repository }}"'",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "`'"${{ env.SHORT_SHA }}"'`",
                    "inline": false
                  },
                  {
                    "name": "Workflow",
                    "value": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
                  }
                ],
                "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ EZ Prep Deployment Failed",
                "color": 15548997,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "'"${{ github.repository }}"'",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "`'"${{ env.SHORT_SHA }}"'`",
                    "inline": false
                  },
                  {
                    "name": "Workflow",
                    "value": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
                  }
                ],
                "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy-examflex:
    name: Deploy ExamFlex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-examflex
      cancel-in-progress: true

    steps:
      - name: Checkout repository
